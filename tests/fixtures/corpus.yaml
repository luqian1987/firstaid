# 回归集：真实报告转录的夹具，每一份都必须能整条流水线跑绿。
#
# 与 _scope.yaml 同一个写法：每一个夹具文件要么在 cases 里，
# 要么在 excluded 里写明为什么不算回归案例。漏登记即测试失败——
# "加了一个夹具但忘了让它跑" 这种状态不允许存在。
cases:
  - file: zhang_real_2026-03-30.yaml
    who: 43 岁男，2026-03-30，三家机构合并（主报告 + FibroScan + TBNK）
    why: >-
      主线是遗传性的脂蛋白(a) 加颅内 M1 段狭窄，而常规血脂全部正常。
      检验它的是："常规全正常但组合提示风险" 这一类，以及多来源合并与纠错。

  - file: case2_2024-08-03.yaml
    who: 64 岁男，2024-08-03，单份综合体检报告
    why: >-
      与病例 1 的对照面：同样脂蛋白(a) 高，但这次颈动脉已经有斑块，
      而且代谢驱动在场（空腹血糖高、高密度脂蛋白低、腰臀比高而 BMI 正常）。
      检验它的是：多因素同向偏离 + 已有落点、附带发现、判据不全的发现，
      以及规则在换一个人时会不会因为少几项检查就整条报废。

  - file: case3_2026-03-30.yaml
    who: 42 岁女，2026-03-30，与病例 1 同院同日，原始 PDF 拆成两份上传
    why: >-
      补的是此前完全没有的三个面：第一位女性受检者（性别相关区间、妇科与乳腺）、
      第一例自身免疫（抗过氧化物酶抗体 31 倍上限而甲功全正常）、
      以及第一次以"偏低"为主（六项低被分给了五个科室）。
      原报告 20 条结论，目前三例里最多的一份。

excluded:
  - file: zhang_2026-03-30.yaml
    why: >-
      早期手写夹具，不是真实报告转录，缺原报告结论层因此无法对账。
      保留它是因为多条单元测试用它做最小样本，不作为回归案例。

# 错误台账。
#
# 这套系统的核心哲学是"每条观察必须有归宿，异常项无归宿即构建失败"。
# 同样的思路用在错误上：**每个记下来的错必须有归宿**——落在哪一层、被哪条测试守着。
# 没有归宿的错，等于只是被记下来但没真修。
#
# 修复层级（越靠前越有价值，因为只有前两层能防止同类再犯）：
#   invariant  构建期断言 —— 让整类错无法通过构建
#   criterion  可援引的判据 —— 让人的判断有依据，且"必须援引判据"本身又是断言
#   archetype  新增一类推理模式 —— 知识库的代码侧
#   knowledge  纯数据条目（规则/通路/本体/别名）
#   hardcode   兜底。必须在 why_not_general 里说明为什么上不去
#
# guarded_by 必须指向真实存在且通过的测试，test_lessons.py 会校验这一点。
# 台账本身是活的，不是一份没人看的文档。

lessons:
  - id: L001
    phase: design
    symptom: 「现在要做」档的牙龈出血没有出现在拓扑图上，而没有任何东西报错
    root_cause: 拓扑这一层没有覆盖率断言。漏画是静默的
    layer: invariant
    fix: 行动档的每条判读，要么有通路、要么在 no_progression 里写明理由，否则构建失败
    guarded_by:
      - tests/test_depth.py::test_topology_covers_every_action_band_chain_or_says_why_not
      - tests/test_depth.py::test_missing_declaration_fails_the_build
      - tests/test_depth.py::test_oral_chain_is_on_the_chart

  - id: L002
    phase: design
    symptom: 胃黏膜萎缩与脾功能亢进被排除出拓扑图，事后发现两条都是可判定的演变关口
    root_cause: 排除是一条条凭感觉写理由，没有统一标准，所以宽严不一
    layer: criterion
    fix: >-
      进图判据写死成三条（是演变过程 / 至少一关有指标能判定 / 至少一关不是判不了），
      并加断言：排除理由必须援引判据
    guarded_by:
      - tests/test_depth.py::test_excluded_chains_all_cite_the_criterion
      - tests/test_depth.py::test_the_two_previously_misjudged_chains_are_now_on_the_chart

  - id: L003
    phase: design
    symptom: 报告里指标序号一直是空白
    root_cause: >-
      YAML 1.1 把不加引号的 no 解析成布尔 False，于是 {no: 1} 变成 {False: 1}，
      模板取 f.no 得到 Undefined，静默渲染成空
    layer: invariant
    fix: 字段改名为 seq；并由模板渲染后的自检拦截未渲染标记与空值
    guarded_by:
      - tests/test_render.py::test_no_unrendered_template_markers
    note: 泛化不成医学判据，但能变成构建期校验——所以落 invariant，不是 hardcode

  - id: L004
    phase: design
    symptom: 参考区间 "10--60"（真实医院写法）被解析成 10 至 -60
    root_cause: 正则里 [-+]? 把第二个连字符吃成了负号，且双连字符模式排在单连字符之后
    layer: knowledge
    fix: 双连字符模式前置，并限制其右侧只匹配非负数
    guarded_by:
      - tests/test_normalize.py::test_parse_bounded
    note: 只能靠积累各家医院写法，无法从原理上穷举——属于知识条目层

  - id: L005
    phase: design
    symptom: 唾液胃蛋白酶"阳性"、牙龈出血"是"静静落进"无区间"，逃过覆盖率审计
    root_cause: 定性指标的"参考区间"其实是期望值，系统只会拿数值区间判定
    layer: invariant
    fix: 定性期望值判定；并引入 Observation.judged，让模式层采信已判定的状态而非只看数值区间
    guarded_by:
      - tests/test_pipeline.py::test_coverage_every_observation_has_a_disposition

  - id: L006
    phase: design
    symptom: 钾的参考区间含条件从句解析失败，被当成"原报告没给区间"
    root_cause: 系统没有区分"报告没给"与"给了但读不懂"，两者都落 NO_RANGE
    layer: invariant
    fix: 区分 NO_RANGE 与 UNKNOWN；后者保留原值、不判高低、进审计的"暂未判定高低"
    guarded_by:
      - tests/test_normalize.py::test_unparseable_range_is_none_not_guessed

  - id: L007
    phase: design
    symptom: 药名剂量拦截正则把化验值 456.7 mg/L 当成剂量
    root_cause: 测试自身的 bug。剂量与浓度共用 mg 单位，没有区分
    layer: invariant
    fix: mg 后面跟斜杠的判为浓度不拦；并同时保留正反两个用例
    guarded_by:
      - tests/test_depth.py::test_clinical_interventions_never_name_a_drug_or_dose
    note: 测试写错和代码写错一样要记。误报会让人开始忽略这条测试

  - id: L008
    phase: design
    symptom: 三条无上游路径共用一句写死的"血压、血糖均正常"，那只对肾成立
    root_cause: 渲染层写死了本该按路径给的内容
    layer: invariant
    fix: 改为 no_upstream_note 按路径声明；断言三条说明各不相同且都出现在图上
    guarded_by:
      - tests/test_depth.py::test_tracks_without_upstream_explain_why_per_track

  - id: L009
    phase: design
    symptom: 首屏论点写死在模板里
    root_cause: 渲染层做了本该由 L4 排序决定的判断
    layer: invariant
    fix: 首屏数字全部由对账层给出；断言模板里的数与数据一致
    guarded_by:
      - tests/test_render.py::test_hero_counts_come_from_the_data

  - id: L010
    phase: design
    symptom: 规则 id 与指标 code 泄漏到给客户看的正文里
    root_cause: 内部标识与展示名没有分离
    layer: invariant
    fix: 边界表与验证指标改用中文名；断言正文中不出现 a.b_c 形态的内部标识
    guarded_by:
      - tests/test_render.py::test_no_internal_identifiers_leak

  - id: L011
    phase: design
    symptom: 表达式引用不存在的指标时抛 NameError，未被捕获
    root_cause: 求值层只捕获了 TypeError/AttributeError/KeyError
    layer: invariant
    fix: 补捕 NameError，使缺输入统一求值为 None → 上层判 INDETERMINATE
    guarded_by:
      - tests/test_derive.py::test_expression_missing_input_yields_none_not_false
    note: 这条的要害是"缺输入绝不能被静默当成 False"，与全系统三态语义一致

  - id: L012
    phase: design
    symptom: 覆盖率审计报告前白蛋白与辅酶Q10 两项异常无人认领，构建失败
    root_cause: 知识库缺规则。不是数据特殊，是能力缺口
    layer: archetype
    fix: 新增第 10 类模式 range_kind_caveat（拿实验室自有百分位当疾病界值）
    guarded_by:
      - tests/test_pipeline.py::test_coverage_every_observation_has_a_disposition
    note: 这是审计层按设计工作的例子——它主动暴露了知识库缺口，而不是让漏洞静默通过

  - id: L013
    phase: design
    symptom: 尿微量白蛋白两项都在区间内、双双贴近上限，现有模式一条都覆盖不到
    root_cause: 缺少"多指标同处区间同一端"这类推理
    layer: archetype
    fix: 新增第 11 类模式 borderline_concordant
    guarded_by:
      - tests/test_pipeline.py::test_coverage_every_observation_has_a_disposition

  - id: L014
    phase: design
    symptom: 参考实现把脂蛋白(a) 归进"值得重视，也能主动改善"章，并配了一整套饮食运动方案
    root_cause: 指标的可改变性不是本体的强制属性，分章时无从校验
    layer: invariant
    fix: modifiability 成为本体强制属性；不可改变的主线不得进可行动章，违反即构建失败
    guarded_by:
      - tests/test_pipeline.py::test_lpa_never_lands_in_actionable_chapter
      - tests/test_pipeline.py::test_chapter_invariant_is_enforced
    note: 这条不是我们犯的，是从参考实现学到的。别人的错同样要进台账

  # ---- 以下五条来自第二份真实报告（病例 2，64 岁男）。
  #      回归集的价值在这里第一次兑现：五个错全是"换一个人才会犯"的错。----

  - id: L015
    phase: design
    symptom: >-
      规则在第二个病人身上直接崩溃：compare_next 里列的 CAP，
      那个人没做 FibroScan，取不到就抛异常，整条判读连同整份报告一起失败
    root_cause: >-
      规则是对着第一个病人写的，隐含假设"我引用的指标一定在"。
      少做一项检查在体检里是常态，不是异常输入
    layer: invariant
    fix: >-
      本次没做的项从 compare_next 里跳过；但如果列出的指标一个都不在，
      这条判读给不出可比基线，那才是真错，仍然报错
    guarded_by:
      - tests/test_audit.py::test_compare_next_survives_a_missing_indicator
      - tests/test_corpus.py::test_real_case_builds
    note: >-
      泛化的关键在于分清两件事——少一项是数据缺口，一项不剩是规则写错。
      不分清就只能在"到处崩"和"到处静默"之间二选一

  - id: L016
    phase: design
    symptom: >-
      新写的动脉粥样硬化规则没有命中，而构建全绿、没有任何报错。
      查下去才发现它引用的腰臀比是派生值、派生值不带参考区间、
      知识库也没给切点，于是那一项永远判不了，整条规则静默退化成"输入不全"
    root_cause: >-
      审计层把所有"判不了"当成同一件事。
      本次没做这项检查（数据缺口）与本系统对它没有任何判据（知识库缺口）
      是两种完全不同的处境，前者合法，后者是我们的 bug
    layer: invariant
    fix: >-
      覆盖率审计区分两者：指标有值、却既无报告区间也无带出处的切点时，
      登记为 no_criterion 并让构建失败，错误信息直接指向该补什么
    guarded_by:
      - tests/test_audit.py::test_measured_but_unjudgeable_input_fails_the_build
      - tests/test_audit.py::test_advisory_cutoff_counts_as_a_criterion
      - tests/test_audit.py::test_test_not_done_is_a_data_gap_not_a_build_failure
    note: >-
      这是本次最有价值的一条：静默失效比崩溃危险得多。
      同一个断言以后会挡住每一个"规则引用了判不了的指标"的实例

  - id: L017
    phase: design
    symptom: >-
      病例 2 体重指数 21.8 完全正常、腰臀比 0.92 超标，
      而拓扑图的"中心性脂肪"上游判定为不在场，整个代谢驱动被漏掉
    root_cause: 上游的在场条件只看腰高比与 BMI 两项，写的时候心里想的是第一个病人
    layer: knowledge
    fix: 腰臀比并入该上游的判定条件，报告自带区间与 WHO 切点两套判据都认
    guarded_by:
      - tests/test_corpus.py::test_real_case_builds
    note: >-
      这一条只能落 knowledge —— "哪些指标构成中心性脂肪"是医学内容，
      不是可以由断言推出来的东西。但它暴露的通病可以泛化：
      任何"多选一"的判定条件都可能是照着单个病例写窄的

  - id: L018
    phase: design
    symptom: >-
      膀胱泥沙样沉积是异常项，必须有归宿，但能给它定性的三项检查
      （尿常规、残余尿、尿培养）本次一项都没做。
      系统里没有任何合法归宿容得下它，只剩两条路：编一个结论，或让构建一直红着
    root_cause: >-
      缺一类推理模式。"发现在场但判据全缺"在体检里极常见（影像上的非特异所见），
      而它既不能降级也不能给结论
    layer: archetype
    fix: >-
      新增第 14 类模式 unsettled_finding：归宿的内容不是结论，
      是"要它有意义还缺哪几项、每一项能定什么、怎么补"。
      只在那些检查全都缺席时成立——有一项做了就该由读那一项的规则来判，
      不许用它绕过已有证据
    guarded_by:
      - tests/test_corpus.py::test_real_case_builds
      - tests/test_rules.py::test_rule_fixtures

  - id: L019
    phase: design
    symptom: 甲状腺术后状态被算成异常项，进了覆盖率审计的待认领队列
    root_cause: 夹具给它写了"参考值：阴性"。术后状态是一个事实，不是一项有正常值的检查
    layer: knowledge
    fix: 去掉该项的期望值；定性期望值只写给真正有正常/异常之分的项目
    guarded_by:
      - tests/test_corpus.py::test_real_case_builds
    note: >-
      转录阶段的错，但它能被审计层抓到——异常项无归宿会让构建失败，
      于是"转录时多写了一个期望值"不会静默留在数据里

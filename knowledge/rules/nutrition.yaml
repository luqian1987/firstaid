# 这两条规则是覆盖率审计逼出来的：
# 前白蛋白与辅酶Q10 反复落进 UNRESOLVED，说明知识库缺规则，不是数据特殊。
rules:
  # 模式 6：孤立异常缺乏佐证
  - id: nutrition.prealbumin_isolated_high
    archetype: isolated_abnormal
    headline: 白蛋白与肝功能其余项全正常，单项轻度升高无独立意义
    title: 前白蛋白略高，在其余蛋白与肝功能正常的背景下无独立意义
    lede: 前白蛋白半衰期短、波动大，单独轻度升高不构成需要处理的问题。
    tag: reassure
    chapter: downgrade
    modifiability: clinical
    priority: 10
    params:
      abnormal: PREALBUMIN
      direction: high
      corroborators: [ALB, ALT, AST]
      corroborator_expect: in_range
    narration:
      single_read: >-
        报告上打了向上的箭头，于是它和其他异常并列出现在需要关注的清单里，
        看起来是又一个待处理的问题。
      joint_read: >-
        前白蛋白 {PREALBUMIN} mg/L 略高于上限，而白蛋白 {ALB}、ALT {ALT}、AST {AST}
        均在区间内。在蛋白合成与肝功能其余项都正常的背景下，
        单独一项前白蛋白轻度升高没有独立解释力。
      must_convey: ["与其并行的蛋白与肝功能指标均正常"]
      must_not_claim: ["不得据此判断营养状态优良", "不得排除个体波动"]
    verdict:
      certain: 本次不构成需要处理的问题，也不需要为它单独复查。
      not_certain: 不能据此判断营养状态；单次轻度偏离的解释力有限。
      next_steps: ["随下次常规体检一起看即可"]
      compare_next:
        - code: PREALBUMIN
          what: 与白蛋白一起看，而不是单看前白蛋白一个数
    tests:
      - {name: 张韦韦本次, fixture: zhang_2026-03-30, expect: triggered}
      - {name: 白蛋白也异常则不成立, fixture: zhang_2026-03-30, expect: not_triggered,
         overrides: {ALB: 32.0}}

  # 模式 10：区间口径不当
  - id: nutrition.coq10_lab_percentile
    archetype: range_kind_caveat
    headline: 这个「不足」用的是实验室百分位区间，不是疾病界值
    title: 辅酶Q10 的"不足"用的是实验室自有区间，不是疾病界值
    lede: >-
      同样一个向下的箭头，背后的区间口径不同，含义完全不同。
      这一条的区间是该实验室按健康人分位数定的，不是任何疾病的诊断界值。
    tag: reassure
    chapter: downgrade
    modifiability: self_modifiable
    priority: 8
    params:
      code: COQ10
      caveat_kinds: [lab_percentile]
    narration:
      single_read: >-
        "辅酶Q10 不足" 读起来像一个明确的缺乏状态，
        自然会引向"要不要补"的问题，而补充剂正是最容易被照做的建议。
      joint_read: >-
        这个"不足"用的区间口径是 {$source_note}。
        百分位区间的意思是"低于多数健康人"，不等于"低到会出问题"——
        它没有对应任何疾病界值。在没有服用他汀、没有心衰的前提下，
        这个数值不构成需要处理的问题。
      must_convey:
        - 这条区间是实验室自有百分位区间，不是疾病界值
        - 低于百分位区间不等于存在缺乏状态
      must_not_claim:
        - 不得据此推荐或否定补充剂
        - 不得声称该数值与任何临床结局相关
    verdict:
      certain: >-
        以本次口径，这一条不构成需要处理的问题，
        也不应与用疾病界值判定的异常项并列排序。
      not_certain: >-
        不能由此认定辅酶Q10 水平对本人没有意义。
        若正在服用他汀或有心功能问题，需要由医生结合临床判断，而不是看这个箭头。
      next_steps:
        - 若在服他汀或有心脏方面的既往问题，把这个数值一并交给经治医生判断
        - 不因为这个箭头自行开始服用补充剂
      compare_next:
        - code: COQ10
          what: 复查时先确认区间口径是否仍是同一实验室的百分位区间
          caveat: 换实验室后区间口径可能完全不同，数值不可直接比
    tests:
      - {name: 张韦韦本次, fixture: zhang_2026-03-30, expect: triggered}
      - {name: 疾病界值口径时不适用, fixture: zhang_2026-03-30, expect: not_triggered,
         overrides: {COQ10__ref_kind: disease_cutoff}}

  # 模式 6：孤立异常缺乏佐证
  - id: nutrition.vitamin_a_isolated_high
    archetype: isolated_abnormal
    headline: 其余三项脂溶性维生素都正常，先列补充剂清单再说
    title: 维生素A 单独升高，其余脂溶性维生素都在区间内
    lede: >-
      脂溶性维生素会在体内蓄积。四项里只有一项高、其余三项正常，
      这个形态首先要问的是来源，而不是代谢。
    tag: retest_first
    chapter: watch
    modifiability: self_modifiable
    priority: 38
    params:
      abnormal: VIT_A
      direction: high
      corroborators: [VIT_E, VIT_K1, VITD_25OH]
      corroborator_expect: in_range
    extra_evidence: [ALT, AST, TBIL, VITD_25OHD2, VITD_25OHD3]
    needs_context: [medications]
    narration:
      single_read: >-
        "维生素A 高"被列进"其他"一栏，和 B6、叶酸的建议放在一起，
        没有说明它意味着什么，也没有说明该不该处理。
      joint_read: >-
        维生素A {VIT_A} ng/ml 超出上限，而同一次检测的维生素E {VIT_E}、
        维生素K1 {VIT_K1}、25-羟基维生素总D {VITD_25OH} 全部在区间内。
        四项脂溶性维生素同批检测、同一份样本，只有一项偏离——
        这不像吸收或代谢的整体改变，更像单一来源的额外摄入。
        肝功能侧也没有支持胆汁淤积的证据：ALT {ALT}、AST {AST}、总胆红素 {TBIL} 均正常。
        所以第一个要回答的问题是：有没有在吃含维生素A 的补充剂、复合维生素或鱼肝油。
      must_convey:
        - 四项脂溶性维生素只有一项偏离，形态指向单一来源
        - 肝功能正常，不支持胆汁淤积导致的脂溶性维生素蓄积
        - 在拿到补充剂清单之前，不对这一条做进一步解释
      must_not_claim:
        - 不得诊断维生素A 过量或中毒
        - 不得在不知道摄入来源的情况下建议停用任何东西
    verdict:
      certain: >-
        需要先补一份信息而不是先做一项检查：在服的所有补充剂清单。
        这份清单同时也会影响 GGT 那一条判读，两处都在等同一个答案。
      not_certain: >-
        不能认定维生素A 过量。单次血清维生素A 受近期摄入影响明显，
        且本判读完全不知道本人的补充剂情况。
      next_steps:
        - 列出在服的所有药物与保健品，含复合维生素、鱼肝油、蛋白粉与功能饮料
        - 若确有含维生素A 的补充剂，停用 4–8 周后复测本项
        - 不需要为此单独就诊；下次体检顺带复查即可
      compare_next:
        - code: VIT_A
          what: 复测时同时记录停用与否、停用多久，否则数值无法解释
          caveat: 需空腹、同一实验室
    tests:
      - {name: 张韦韦真实数据, fixture: zhang_real_2026-03-30, expect: triggered}
      - {name: 其余脂溶性维生素也高则不是孤立形态, fixture: zhang_real_2026-03-30,
         expect: not_triggered, overrides: {VIT_E: 22000}}

rules:
  # 模式 8：常规组套全正常，但组合提示的东西不在这个组套里。
  # 与脂蛋白(a) 那条同一个骨架：功能五项全正常，而抗体两项显著升高，
  # 影像形态学与之一致。三条不是三个发现，是一个诊断。
  - id: thyroid.hashimoto_euthyroid
    archetype: normal_panel_hidden_risk
    title: 甲状腺功能五项全部正常，而抗体与超声指向同一个诊断
    headline: 抗体与超声合起来是桥本，功能目前仍正常——要变的是监测节奏
    lede: >-
      抗甲状腺过氧化物酶抗体 939.6 是上限的 31 倍，抗甲状腺球蛋白抗体也高，
      而同一次抽血的促甲状腺激素、游离甲状腺激素、T3、T4 全部在区间内。
      超声写的"弥漫性病变"与这两个抗体说的是同一件事。
    tag: needs_specialist
    chapter: watch
    modifiability: clinical
    priority: 90
    params:
      panel: [TSH, FT4, FT3, TT3, TT4]
      hidden: TPO_AB
      hidden_direction: high
      anchors: [THYROID_DIFFUSE]
      anchor_mode: any
      negative_anchors: []
    extra_evidence: [TG_AB, TG_THYRO, HGB, MCV]
    needs_context: [medications, symptoms, family_early_cvd]
    narration:
      single_read: >-
        原报告把它拆成两条：超声一条"甲状腺弥漫性病变（建议结合甲功及相关抗体）"，
        抗体一条"抗甲状腺球蛋白抗体高；抗甲状腺过氧化物酶抗体高"，
        都归到"进一步检查"，建议内分泌科随诊、定期复查、注意饮食情绪。
        单看抗体的数字，931 这种量级会让人以为病得很重。
      joint_read: >-
        超声说的"回声增粗、不均匀、见小片状偏低回声"，正是自身免疫性甲状腺炎
        在形态上的样子；抗过氧化物酶抗体 {TPO_AB} IU/mL 与抗甲状腺球蛋白抗体
        {TG_AB} IU/mL 是它在免疫上的样子。两者说的是同一件事，
        所以这不是"两个异常加一个影像发现"，是一个诊断的三个侧面。
        真正决定当下要不要处理的是第三件事：功能。
        促甲状腺激素 {TSH}、游离甲状腺激素 {FT4}、游离T3 {FT3} 全部在区间内，
        说明腺体目前仍然把激素造够了。
        抗体的滴度不代表严重程度，也不预测什么时候会失代偿——
        它改变的只有一件事：监测的节奏。从"有症状再查"变成"按约定的间隔查促甲状腺激素"。
      must_convey:
        - 抗体与超声指向同一个诊断，不是两个独立异常
        - 功能五项全部正常，当下不需要治疗
        - 抗体滴度不代表严重程度，也不需要"降下来"
        - 这一条改变的是复查节奏，不是现在的用药
      must_not_claim:
        - 不得预测多久会发展成甲减，也不得给出概率
        - 不得由抗体滴度推断病情轻重
        - 不得建议补硒、忌碘或任何针对抗体的处理
        - 不得据此解释疲劳、体重、情绪等非特异症状
    verdict:
      certain: >-
        诊断层面这三条已经清楚了，当下不需要任何治疗。
        要做的是把复查节奏定下来，并把它和这次报告里另外几项联系起来看
        ——自身免疫甲状腺病常与其他自身免疫情况同时存在。
      not_certain: >-
        本次没有做甲状腺自身免疫以外的自身抗体，也没有症状记录，
        所以不能判断有没有并存的其他自身免疫问题，只能说"值得在门诊问一句"。
        促甲状腺激素是单次值，它本身在一天内和季节间都有波动，
        单看这一次不能确认功能长期稳定。
      next_steps:
        - 到内分泌科时带上这份抗体与超声，问清楚复查促甲状腺激素的间隔
        - 抗体不需要跟着复查，它的滴度变化不改变处理
        - 记录有没有怕冷、便秘、乏力、月经变化——这些比抗体数字更能提示功能开始变化
        - 家族里有甲状腺病或其他自身免疫病史的话，在门诊说明
      compare_next:
        - code: TSH
          what: 促甲状腺激素。它是这条线上唯一需要定期看的数
          rationale: 功能失代偿最先反映在它身上，早于游离甲状腺激素
        - code: FT4
          what: 与促甲状腺激素同次测，两者一起才能分清是哪一层的问题
        - code: TPO_AB
          what: 不需要年年复查。它的作用是已经完成的——把诊断定下来
    tests:
      - {name: 病例3真实数据, fixture: case3_2026-03-30, expect: triggered}
      - {name: 促甲状腺激素也异常时不成立, fixture: case3_2026-03-30, expect: not_triggered,
         overrides: {TSH: 12.0}}
      # 病例 1 抗体做了且是阴性（<2.0），所以是明确的"不成立"，不是"判不了"
      - {name: 病例1抗体阴性，明确不成立, fixture: zhang_real_2026-03-30, expect: not_triggered}

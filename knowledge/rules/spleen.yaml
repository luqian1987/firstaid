rules:
  # 模式 5：多层排除
  - id: spleen.layered_exclusion
    archetype: layered_exclusion
    title: 脾脏增大：三系正常、无纤维化、门静脉正常
    lede: >-
      原报告只给了"脾大"两个字，但超声描述里其实有精确尺寸。
      把尺寸和血液背景放在一起，这一条不需要占用主要关注。
    tag: downgrade
    chapter: downgrade
    modifiability: not_modifiable
    priority: 30
    params:
      finding: SPLEEN_THICK
      layers:
        - name: 尺寸层
          codes: [SPLEEN_LENGTH]
          expect: advisory_in_range
        - name: 功能层
          codes: [PLT, WBC, HGB]
          expect: in_range
        - name: 上游层·定量
          codes: [LSM, ALB, PT]
          expect: in_range_or_advisory_in_range
        - name: 上游层·影像
          codes: [PORTAL_VEIN]
          expect: normal_text
    extra_evidence: [INR]
    narration:
      single_read: >-
        "脾大"是一个听起来需要查病因的结论——感染、血液系统疾病、门脉高压都可能，
        于是变成一件悬而未决、需要反复惦记的事。
      joint_read: >-
        先看尺寸本身：长径 {SPLEEN_LENGTH} mm 其实还在常用界值以内，
        超标的只有厚径 {SPLEEN_THICK} mm，属于轻度。再看功能：血小板 {PLT}、
        白细胞 {WBC}、血红蛋白 {HGB} 全部正常，不存在脾功能亢进。再看上游：
        肝脏硬度 {LSM} kPa 无明显纤维化、门静脉主干内径正常、白蛋白与凝血酶原时间正常，
        门脉高压这条路径也没有支持证据。三层都排除之后，剩下的是一个轻度的结构性差异，
        作为基线年度复查即可。
      must_convey:
        - 长径仍在常用界值内，超标的只有厚径
        - 三系正常即无脾功能亢进
        - 上游三项正常即无门脉高压证据
      must_not_claim:
        - 不得认定以后不会变化
        - 不得仅凭一次超声排除全部血液系统原因
    verdict:
      certain: >-
        目前无脾功能影响，也没有指向肝硬化或门脉高压的证据。这一条不应排在本次前三位。
      not_certain: >-
        不能认定以后不会变化，也不能仅凭一次超声排除全部血液系统原因。
        只是说，以现有资料没有理由启动进一步检查。
      next_steps:
        - 不需要专门就诊。随年度体检的腹部超声一起看即可
        - 出现左上腹持续不适、不明原因瘀斑或反复感染时，再提前评估
      compare_next:
        - code: SPLEEN_LENGTH
          what: 比长径与厚径这两个数，不是比报告结论里有没有"脾大"两个字
          caveat: 需同一检查方式
        - code: PLT
          what: 同时看血小板有没有往下走——那是脾功能开始受影响的第一个信号
    tests:
      - {name: 张韦韦本次, fixture: zhang_2026-03-30, expect: triggered}
      - {name: 血小板下降则不可降级, fixture: zhang_2026-03-30, expect: not_triggered,
         overrides: {PLT: 88}}
      - {name: 缺门静脉描述时不可评估, fixture: zhang_2026-03-30, expect: indeterminate,
         overrides: {PORTAL_VEIN: null}}

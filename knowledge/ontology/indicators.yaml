    modifiability: clinical
  - code: CAP
    name: 肝脏脂肪衰减
    short: CAP
    aliases: ["受控衰减参数", "脂肪衰减"]
    canonical_unit: dB/m
    kind: imaging
    system: liver
    modifiability: self_modifiable
    device_sensitive: true
    advisory_high: 248
    advisory_note: 常用切点之一：约 248 dB/m 以上提示脂肪变；各家切点不一致
    advisory_source: 知识库补充（原报告未给区间）
    note: 原报告常不给参考区间；换设备数值不可比
  - code: LSM
    name: 肝脏硬度
    short: LSM
    aliases: ["肝脏硬度值", "弹性值"]
    canonical_unit: kPa
    kind: imaging
    system: liver
    modifiability: clinical
    device_sensitive: true
    advisory_high: 7.0
    advisory_note: 常用切点 7.0 kPa 以下无明显纤维化
    advisory_source: 知识库补充（原报告未给区间）


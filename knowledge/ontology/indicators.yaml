# 指标本体。数据来源泛化，所以别名表必须能长期扩充。
#
# modifiability 是强制属性，不是备注：
#   组装层据此拒绝把 not_modifiable 的主线放进「值得重视，也能主动改善」章。
#   Lp(a) 被配上一整套饮食运动方案，是分类错误，不是文案问题。
indicators:
  # ---------------- 血脂与脂蛋白 ----------------
  - code: LPA
    name: 脂蛋白(a)
    short: Lp(a)
    aliases: ["脂蛋白a", "LP(a)", "Lpa", "脂蛋白（a）"]
    canonical_unit: mg/L
    system: lipid
    modifiability: not_modifiable
    modifiability_note: 由基因决定，终生基本不变；饮食、运动、减重不改变它
    note: 常规血脂四项测不到它；每个颗粒携带一个 ApoB

  - code: LDL_C
    name: 低密度脂蛋白胆固醇
    short: LDL-C
    aliases: ["低密度脂蛋白", "LDLC", "LDL胆固醇"]
    canonical_unit: mmol/L
    system: lipid
    modifiability: self_modifiable

  - code: TC
    name: 总胆固醇
    aliases: ["胆固醇", "TCHO", "CHOL"]
    canonical_unit: mmol/L
    system: lipid
    modifiability: self_modifiable

  - code: TG
    name: 甘油三酯
    aliases: ["三酰甘油", "TRIG"]
    canonical_unit: mmol/L
    system: lipid
    modifiability: self_modifiable

  - code: HDL_C
    name: 高密度脂蛋白胆固醇
    short: HDL-C
    aliases: ["高密度脂蛋白", "HDLC"]
    canonical_unit: mmol/L
    system: lipid
    modifiability: self_modifiable

  - code: SDLDL_C
    name: 小而密低密度脂蛋白胆固醇
    short: sdLDL-C
    canonical_unit: mmol/L
    system: lipid
    modifiability: self_modifiable

  - code: APOB
    name: 载脂蛋白B
    short: ApoB
    aliases: ["载脂蛋白B(APOB)", "APO-B", "APOB100"]
    canonical_unit: g/L
    system: lipid
    modifiability: self_modifiable

  - code: APOA1
    name: 载脂蛋白AⅠ
    short: ApoA1
    aliases: ["载脂蛋白A1", "APO-A1", "APOA-Ⅰ", "载脂蛋白A Ⅰ"]
    canonical_unit: g/L
    system: lipid
    modifiability: self_modifiable

  # ---------------- 肝脏 ----------------

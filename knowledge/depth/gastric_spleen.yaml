pathways:
  # 本次的发现（唾液胃蛋白酶阳性）指向反流方向，但反流那条缺症状记录与镜下所见，
  # 画不出可判定的关口。这里画的是另一个方向——胃黏膜萎缩，它本次有直接血清学指标。
  - id: gastric.atrophy
    label: 胃黏膜
    upstream: null
    chain: gastric.saliva_pepsin_vs_normal_panel
    gate_kind: recheck
    no_upstream_note: 幽门螺杆菌本次未检测
    stages:
      - name: 胃黏膜萎缩
        judged_by: [GASTRIN17, PG1, PG2, PG_RATIO]
        crossed_when: "PG_RATIO.is_low or PG1.is_low or GASTRIN17.abnormal"
        col: 1
        detail: "胃泌素17 {GASTRIN17}、PGⅠ {PG1}、PGⅠ/Ⅱ {PG_RATIO} 全部在区间中部"
    tail: >-
      本次的发现是唾液胃蛋白酶阳性，它指向的是反流方向——而反流那条缺症状记录与镜下所见，
      画不出可判定的关口，所以图上没有。这里画的是另一个方向：胃黏膜萎缩，
      它本次有直接血清学指标，且未跨过。真正的下一步不是盯着这张图，是取回胃肠镜报告。
    next_gate: >-
      下一关由 PGⅠ/Ⅱ 比值判定，它比任一单项都稳定。但这条路径的答案其实已经在
      那份没取回的胃肠镜报告里——镜下所见的效力高于任何血清学筛查。

  # 脾大的上游本次已被排除（肝硬度正常、门静脉正常），所以图上没有上游框。
  - id: spleen.hypersplenism
    label: 脾脏
    upstream: null
    chain: spleen.layered_exclusion
    gate_kind: recheck
    no_upstream_note: 门脉高压已排除
    stages:
      - name: 脾脏增大
        judged_by: [SPLEEN_THICK, SPLEEN_LENGTH]
        crossed_when: "SPLEEN_THICK.advisory_high or SPLEEN_LENGTH.advisory_high"
        detail: "长径 {SPLEEN_LENGTH} mm 仍在常用界值内，超标的只有厚径 {SPLEEN_THICK} mm"
      - name: 脾功能亢进
        judged_by: [PLT, WBC, HGB]
        crossed_when: "PLT.is_low or WBC.is_low or HGB.is_low"
        edge: 三系均正常
        detail: "血小板 {PLT}、白细胞 {WBC}、血红蛋白 {HGB} 三系全部在区间内"
    tail: >-
      上游本次已经排除：肝硬度 {LSM} kPa 无明显纤维化、门静脉主干内径正常、
      白蛋白与凝血酶原时间正常，门脉高压这条路径没有支持证据，所以图上没有上游框。
      再往后的阶段取决于脾功能是否受累，而本次三系都正常。
    next_gate: 下一关由血小板判定——它是脾功能开始受影响时最先下行的一项。

# 哪些判读没有进展结构，因此不进拓扑图。
#
# 判据（三条全中才进图，缺一条即排除）：
#   1. 它描述的是一个会沿方向演变的过程 —— 不是静态状态、不是检测口径问题、
#      不是来源问题；
#   2. 该过程上至少有一关本系统有指标能判定；
#   3. 至少有一关的状态不是"判不了" —— 整条都是虚线的图没有信息。
#
# 必须逐条写明理由。构建期校验：行动档的每条链条，要么有通路，要么在这里声明。
# 不允许"忘了画"这种状态存在——牙龈出血、胃黏膜萎缩、脾功能亢进三条
# 都是先被凭感觉排除、后来才发现判错的。
no_progression:
  - chain: lipid.apo_paired_divergence
    why: >-
      不满足判据 1：问题在检测口径，不是身体在演变。画进展图等于预设那个值是真的，
      与本条判读本身矛盾。若复测后 ApoB 仍高，它会并入血管那条路径。
  - chain: nutrition.vitamin_a_isolated_high
    why: 不满足判据 1：要回答的是"来源在哪"，不是"走到哪一关"。
  - chain: coag.fib_low_is_low_inflammation
    why: 不满足判据 1：描述的是当前的低炎症背景，一个状态，不指向任何演变方向。
  - chain: nutrition.prealbumin_isolated_high
    why: 不满足判据 1：单次轻度偏离，没有过程可言。
  - chain: nutrition.coq10_lab_percentile
    why: 不满足判据 1：问题在区间口径，不在身体状态。
  - chain: structural.baseline_ledger
    why: >-
      不满足判据 1：这是多个互不相关发现的集合，没有单一进展方向。
      各项的比较口径已在"下次比什么"里逐条列出。

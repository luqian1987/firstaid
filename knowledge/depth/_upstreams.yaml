# 上游：多条通路的共同起点。
# 是否在场由本人数据求值，不手写。modifiable 决定它在图上画实线还是虚线——
# 虚线本身就在编码"不可改变"，不用引入第四种颜色。
upstreams:
  - id: adipose
    label: 中心性脂肪
    sub: "腰高比 {WHTR} · 腰臀比 {WHR} · BMI {BMI}"
    codes: [WHTR, WHR, BMI, WAIST]
    # 三条各自都可能单独在场：BMI 正常而腰臀比高是常见组合，
    # 只看 WHTR 与 BMI 会把这种人整个漏掉（病例 2 正是如此）。
    # WHR 有的报告自己印区间，有的不印——两套判据都认。
    present_when: "WHTR.is_high or BMI.is_high or WHR.is_high or WHR.advisory_high"
    modifiable: true
    note: 可由本人改变

  - id: lpa_genetic
    label: 脂蛋白(a) 升高
    sub: "{LPA} mg/L · 基因决定"
    codes: [LPA]
    present_when: "LPA.is_high"
    modifiable: false
    note: 饮食运动不改变它

  - id: autoimmunity
    label: 自身免疫
    sub: "抗过氧化物酶抗体 {TPO_AB} · 抗甲状腺球蛋白抗体 {TG_AB}"
    codes: [TPO_AB, TG_AB]
    present_when: "TPO_AB.is_high or TG_AB.is_high"
    modifiable: false
    note: 免疫识别一旦建立不可逆转，能管的是它的下游
